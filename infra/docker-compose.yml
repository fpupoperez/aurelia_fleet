services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aurelia
      POSTGRES_PASSWORD: aurelia
      POSTGRES_DB: aurelia
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurelia -d aurelia"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - aurelia_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://aurelia:aurelia@postgres:5432/aurelia
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /app/data
      CORPUS_DIR: /app/corpus
      EVALUATION_PATH: /app/evaluation/questions.json
      SEED_CORPUS: "true"
      LLM_PROVIDER: ${LLM_PROVIDER:-litellm}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-litellm}
      LLM_MODEL: ${LLM_MODEL:-openai/llama3.1:8b}
      LLM_API_BASE: ${LLM_API_BASE-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_API_VERSION: ${LLM_API_VERSION:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-openai/all-minilm}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-http://host.docker.internal:11434/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-ollama}
      EMBEDDING_API_VERSION: ${EMBEDDING_API_VERSION:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
      PDF_READING_ORDER: ${PDF_READING_ORDER:-geometry}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-aurelia-dev-public}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-aurelia-dev-secret}
      LANGFUSE_HOST: http://langfuse-web:3000
      OTEL_SERVICE_NAME: aurelia-api
      AUTH_REQUIRED: "false"
    ports:
      - "8000:8000"
    volumes:
      - aurelia_uploads:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql+psycopg://aurelia:aurelia@postgres:5432/aurelia
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /app/data
      LLM_PROVIDER: ${LLM_PROVIDER:-litellm}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-litellm}
      LLM_MODEL: ${LLM_MODEL:-openai/llama3.1:8b}
      LLM_API_BASE: ${LLM_API_BASE-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-openai/all-minilm}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-http://host.docker.internal:11434/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-ollama}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}
      PDF_READING_ORDER: ${PDF_READING_ORDER:-geometry}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-aurelia-dev-public}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-aurelia-dev-secret}
      LANGFUSE_HOST: http://langfuse-web:3000
      OTEL_SERVICE_NAME: aurelia-worker
    volumes:
      - aurelia_uploads:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    environment:
      API_PROXY: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

  mcp:
    build:
      context: ..
      dockerfile: infra/Dockerfile.mcp
    environment:
      API_BASE_URL: http://api:8000/api/v1
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8001"
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-aurelia-dev-public}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-aurelia-dev-secret}
      LANGFUSE_HOST: http://langfuse-web:3000
    ports:
      - "8001:8001"
    depends_on:
      - api

  langfuse-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - langfuse_postgres:/var/lib/postgresql/data

  langfuse-redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "langfusecache"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "langfusecache", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:26.4
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - langfuse_clickhouse:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: bitnamilegacy/minio:2024
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    volumes:
      - langfuse_minio:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: bitnamilegacy/minio-client:2024
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio miniosecret &&
      mc mb --ignore-existing local/langfuse
      "

  langfuse-web:
    image: ghcr.io/langfuse/langfuse:4
    ports:
      - "3000:3000"
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment: &langfuse-env
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: aurelia-dev-nextauth-secret
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-postgres:5432/langfuse
      SALT: aurelia-dev-salt
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: langfusecache
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_INIT_ORG_ID: aurelia
      LANGFUSE_INIT_ORG_NAME: Aurelia
      LANGFUSE_INIT_PROJECT_ID: aurelia-fleet
      LANGFUSE_INIT_PROJECT_NAME: Aurelia Fleet
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-aurelia-dev-public
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-aurelia-dev-secret
      LANGFUSE_INIT_USER_EMAIL: tech@aurelia.example
      LANGFUSE_INIT_USER_NAME: Aurelia Tech
      LANGFUSE_INIT_USER_PASSWORD: aurelia-fleet-dev

  langfuse-worker:
    image: ghcr.io/langfuse/langfuse-worker:4
    depends_on:
      langfuse-web:
        condition: service_started
    environment:
      <<: *langfuse-env

volumes:
  aurelia_postgres:
  aurelia_uploads:
  langfuse_postgres:
  langfuse_clickhouse:
  langfuse_minio:
