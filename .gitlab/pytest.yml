pytest:
  stage: test
  image: python:3.11
  services:
    - name: pgvector/pgvector:pg16
      alias: postgres
  variables:
    POSTGRES_USER: aurelia
    POSTGRES_PASSWORD: aurelia
    POSTGRES_DB: aurelia
    DATABASE_URL: postgresql+psycopg://aurelia:aurelia@postgres:5432/aurelia
    LLM_PROVIDER: fake
    EMBEDDING_PROVIDER: fake
    CELERY_TASK_ALWAYS_EAGER: "true"
    SEED_CORPUS: "false"
  script:
    - pip install -r backend/requirements.txt
    - |
      python <<'PY'
      import os
      import sys
      import time
      import psycopg

      url = os.environ["DATABASE_URL"].replace("postgresql+psycopg://", "postgresql://")
      for _ in range(30):
          try:
              psycopg.connect(url).close()
              break
          except Exception:
              time.sleep(1)
      else:
          sys.exit("PostgreSQL did not become ready")
      PY
    - cd backend && python -m pytest
