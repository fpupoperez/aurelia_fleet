[tool.ruff]
target-version = "py311"
line-length = 110
src = ["backend", "worker", "mcp", "scripts"]
extend-exclude = ["backend/.venv", "frontend"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"mcp/server.py" = ["E402"]
"worker/celery_app.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
files = ["backend/app", "worker", "mcp/server.py", "scripts"]
exclude = ["backend/\\.venv", "backend/migrations", "backend/tests"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = false
